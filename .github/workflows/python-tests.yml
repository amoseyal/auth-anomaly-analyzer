# Name displayed in the GitHub Actions interface.
name: Python Tests

# Run on pushes to main and pull requests targeting main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Follow the principle of least privilege.
permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      # Retrieve the repository's source code.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Configure the Python environment.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Install the projects's declared dependencies.
      # this helps keep CI consistent with local development.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Execute the complete test suite.
      - name: Run pytest
        run: python -m pytest -v